name: Build & Push

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest

    env:
      EMBEDDING_DIM: "2048"
      # Required by Settings (validated by get_settings()); geocode unit tests
      # build a Settings instance but never open a connection.
      DATABASE_URL: "sqlite+aiosqlite://"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: backend/.python-version

      - name: Install backend dependencies
        run: uv sync --frozen --all-extras
        working-directory: backend

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
        working-directory: backend

      - name: Check backend formatting
        run: uv run ruff format . --check
        working-directory: backend

      - name: Lint backend
        run: uv run ruff check .
        working-directory: backend

      - name: Test backend
        run: uv run pytest -n 4
        working-directory: backend

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "12.15"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check frontend formatting
        run: pnpm format:check
        working-directory: frontend

      - name: Lint frontend
        run: pnpm lint
        working-directory: frontend

      - name: Test frontend
        run: pnpm test
        working-directory: frontend

      - name: Check frontend types
        run: pnpm typecheck
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: realestate-api
            dockerfile: docker/backend/Dockerfile
            context: .
          - image: realestate-web
            dockerfile: docker/frontend/Dockerfile
            context: .
          - image: realestate-db
            dockerfile: docker/db/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=1.${{ github.run_number }}.0,enable=${{ github.event_name == 'push' }}
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable=${{ github.event_name == 'push' }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
